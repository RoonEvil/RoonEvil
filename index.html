<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Prompt:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #030705;
    --neon: #39ff88;
    --ink: #d9ffe9;
    --muted: #5f9a7b;
    --mx: 50vw; --my: 40vh;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Prompt", system-ui, sans-serif;
    overflow-x: hidden;
    cursor: crosshair;
  }
  /* แสงเขียวตามเมาส์ + กริด + vignette */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(600px circle at var(--mx) var(--my), rgba(57,255,136,.10), transparent 60%),
      linear-gradient(rgba(57,255,136,.06) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(57,255,136,.06) 1px, transparent 1px) 0 0 / 44px 44px;
  }
  #rain { position: fixed; inset: 0; z-index: 0; opacity: .28; pointer-events: none; }
  #trail { position: fixed; inset: 0; z-index: 95; pointer-events: none; }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }

  #stage { position: relative; z-index: 2; width: 100%; min-height: 100vh; overflow: clip; }

  /* ---------- notes ---------- */
  .note {
    --c: #39ff88;
    position: absolute;
    width: min(290px, 84vw);
    padding: 18px 20px 16px;
    border-radius: 10px;
    background: linear-gradient(160deg, rgba(16,44,30,.92), rgba(4,14,9,.96));
    border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
    box-shadow:
      0 0 26px color-mix(in srgb, var(--c) 28%, transparent),
      inset 0 0 28px color-mix(in srgb, var(--c) 8%, transparent),
      0 18px 40px rgba(0,0,0,.6);
    color: var(--ink);
    font-size: 16px; line-height: 1.6; font-weight: 300;
    transform-origin: top left;
    animation: pop .55s cubic-bezier(.2, 1.4, .4, 1) both;
    rotate: var(--r, 0deg);
    cursor: grab; user-select: none; touch-action: none;
  }
  /* มุมกรอบแบบ HUD */
  .note::before, .note::after {
    content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--c);
    filter: drop-shadow(0 0 4px var(--c));
  }
  .note::before { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
  .note::after { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }
  .note.dragging { cursor: grabbing; z-index: 50; box-shadow: 0 0 40px color-mix(in srgb, var(--c) 55%, transparent), 0 24px 50px rgba(0,0,0,.7); }
  .note h3 {
    margin: 0 0 8px; font: 700 13px "JetBrains Mono", "Prompt", monospace;
    color: var(--c); letter-spacing: .04em; text-shadow: 0 0 8px var(--c);
  }
  .note h3::before { content: "// "; opacity: .6; }
  .note .body { white-space: pre-wrap; word-break: break-word; min-height: 1.6em; }
  .note .by { margin-top: 12px; font: 400 11px "JetBrains Mono", monospace; opacity: .7; letter-spacing: .05em; }
  .note.typing .body::after {
    content: ""; display: inline-block; width: .55em; height: 1.05em;
    background: var(--c); box-shadow: 0 0 10px var(--c);
    vertical-align: -3px; margin-left: 2px;
    animation: blink .7s steps(1) infinite;
  }
  .note.title {
    width: auto; max-width: 92vw; padding: 0;
    background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .note.title::before, .note.title::after { display: none; }
  .note.title h3 { font-size: clamp(13px, 1.8vw, 17px); color: var(--neon); }
  .note.title h3::before { content: "> "; }
  .note.title .body {
    font-size: clamp(42px, 9vw, 104px); font-weight: 800; line-height: 1.1; letter-spacing: -.02em;
    background: linear-gradient(100deg, #f2fff7 10%, #39ff88 45%, #b6ff3b 70%, #0aa860 95%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(57,255,136,.45));
  }
  .note.title.typing .body::after { background: var(--neon); }
  .note.title.done .body { animation: shine 5s linear infinite, glitch 7s steps(1) infinite; }
  .note.visitor .body:empty::before { content: attr(data-placeholder); opacity: .4; }
  .note.visitor .body[contenteditable] { outline: none; cursor: text; user-select: text; }

  @keyframes pop {
    0% { transform: scale(.5); opacity: 0; filter: blur(10px) brightness(3); }
    60% { filter: blur(0) brightness(1.6); }
    100% { transform: scale(1); opacity: 1; filter: none; }
  }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes shine { to { background-position: -200% 0; } }
  @keyframes glitch {
    0%, 100% { transform: none; }
    91% { transform: translate(3px, -1px) skewX(-8deg); }
    92% { transform: translate(-4px, 1px); }
    93% { transform: none; }
    96% { transform: translate(2px, 0) skewX(6deg); }
    97% { transform: none; }
  }

  /* ---------- cursors ---------- */
  .cursor {
    position: absolute; left: 0; top: 0; z-index: 100; pointer-events: none;
    transition: transform var(--dur, 900ms) cubic-bezier(.45, .05, .2, 1);
    will-change: transform;
  }
  .cursor svg { display: block; filter: drop-shadow(0 0 6px var(--cc)) drop-shadow(0 0 2px var(--cc)); transition: transform .12s; }
  .cursor.press svg { transform: scale(.78); }
  .cursor .tag {
    position: absolute; left: 16px; top: 21px;
    padding: 3px 9px; border-radius: 3px 10px 10px 10px;
    background: var(--cc); color: #03110a;
    font: 700 11px "JetBrains Mono", monospace; letter-spacing: .03em; white-space: nowrap;
    box-shadow: 0 0 14px var(--cc);
  }
  .ripple {
    position: absolute; z-index: 90; pointer-events: none;
    width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
    border: 2px solid var(--cc); box-shadow: 0 0 16px var(--cc), inset 0 0 12px var(--cc);
    animation: ripple .7s ease-out forwards;
  }
  @keyframes ripple { from { transform: scale(.15); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }

  /* ---------- boot screen ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 300; background: #010302;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    font: 400 14px/1.8 "JetBrains Mono", monospace; color: var(--neon);
    text-shadow: 0 0 8px rgba(57,255,136,.7);
    transition: opacity .6s, visibility .6s;
  }
  #boot.hide { opacity: 0; visibility: hidden; }
  #boot pre { margin: 0; white-space: pre-wrap; min-width: min(420px, 100%); }
  #boot .ok { color: #b6ff3b; }

  /* ---------- toolbar ---------- */
  .bar { position: fixed; right: 16px; bottom: 16px; z-index: 200; }
  .bar button {
    font: 700 13px "JetBrains Mono", "Prompt", monospace; letter-spacing: .04em;
    border: 1px solid var(--neon); border-radius: 6px; padding: 10px 16px;
    background: rgba(3,12,7,.85); color: var(--neon); cursor: pointer;
    box-shadow: 0 0 18px rgba(57,255,136,.35), inset 0 0 12px rgba(57,255,136,.12);
    text-shadow: 0 0 6px var(--neon); transition: background .2s, color .2s;
  }
  .bar button:hover { background: var(--neon); color: #03110a; text-shadow: none; }
  .hint {
    position: fixed; left: 16px; bottom: 22px; z-index: 200; max-width: calc(100vw - 190px);
    font: 400 12px "JetBrains Mono", "Prompt", monospace; color: var(--muted);
    opacity: 0; transition: opacity .6s;
  }
  .hint.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .cursor { transition-duration: 0ms !important; }
    .note, .note.title.done .body { animation: none; }
    #rain { display: none; }
  }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="bg-grid"></div>
<div class="vignette"></div>
<div id="stage"></div>
<canvas id="trail"></canvas>
<div id="boot"><pre id="bootText"></pre></div>
<div class="hint" id="hint">&gt; คลิกที่ว่างเพื่อทิ้งข้อความ · ลากโน้ตได้</div>
<div class="bar"><button id="replay">↻ REPLAY</button></div>

<script>
/* =========================================================
   ✏️ ข้อมูล (สมมติ) — แก้ตรงนี้
   x, y = ตำแหน่งบนจอใหญ่ (เปอร์เซ็นต์), color = สีเรืองแสงของโน้ต
   ========================================================= */
const NOTES = [
  { type: "title", title: "สวัสดีครับ ผมชื่อ", text: "ภูมิ ใจดีมาก", x: 6, y: 8, by: "Mint" },
  { title: "ตอนนี้ทำอะไรอยู่", text: "Frontend Developer ที่เชียงใหม่\nกลางวันเขียนโค้ด กลางคืนแก้บั๊ก", x: 8, y: 42, color: "#39ff88", by: "Bank" },
  { title: "ชอบอะไร", text: "☕ ลาเต้หวานน้อย\n🐈 แมวส้มชื่อข้าวต้ม\n🎧 Lo-fi ตอนทำงาน", x: 40, y: 36, color: "#00e5b0", by: "Ploy" },
  { title: "สกิล", text: "React · TypeScript · CSS\nFigma · Motion design", x: 70, y: 14, color: "#b6ff3b", by: "Mint" },
  { title: "เป้าหมายปีนี้", text: "ปล่อยแอปของตัวเองสักตัว 🚀\nและนอนก่อนตีสองให้ได้", x: 68, y: 54, color: "#7dffb2", by: "Bank" },
  { title: "ติดต่อ", text: "📧 phum@example.com\n🐦 @phum.codes", x: 36, y: 72, color: "#2bd96b", by: "Ploy" },
];

const CURSORS = [
  { name: "Mint", color: "#39ff88" },
  { name: "Bank", color: "#b6ff3b" },
  { name: "Ploy", color: "#00e5b0" },
];
/* ========================================================= */

const stage = document.getElementById("stage");
const hint = document.getElementById("hint");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let runId = 0;
let liveCursors = [];

/* ---------- พื้นหลัง: ฝนตัวอักษร ---------- */
const rain = document.getElementById("rain"), rctx = rain.getContext("2d");
const glyphs = "アイウエオカキクケコサシスセソタチツテト0123456789กขคงจฉชซฌญ<>/{}=+*".split("");
let drops = [];
function sizeRain() {
  rain.width = innerWidth; rain.height = innerHeight;
  drops = Array.from({ length: Math.ceil(innerWidth / 18) }, () => rand(-40, 0));
}
sizeRain(); addEventListener("resize", () => { sizeRain(); sizeTrail(); });
setInterval(() => {
  if (reduce) return;
  rctx.fillStyle = "rgba(3,7,5,.14)"; rctx.fillRect(0, 0, rain.width, rain.height);
  rctx.font = "15px JetBrains Mono, monospace";
  drops.forEach((d, i) => {
    const ch = glyphs[(Math.random() * glyphs.length) | 0];
    rctx.fillStyle = Math.random() < .08 ? "#d9ffe9" : "#1fd46e";
    rctx.fillText(ch, i * 18, d * 18);
    drops[i] = d * 18 > rain.height && Math.random() > .975 ? 0 : d + 1;
  });
}, 60);

/* ---------- แสงตามเมาส์ ---------- */
addEventListener("pointermove", e => {
  document.documentElement.style.setProperty("--mx", e.clientX + "px");
  document.documentElement.style.setProperty("--my", e.clientY + "px");
});

/* ---------- หางประกายของเคอร์เซอร์ + สะเก็ดตอนคลิก ---------- */
const trail = document.getElementById("trail"), tctx = trail.getContext("2d");
let parts = [];
function sizeTrail() { const d = devicePixelRatio || 1; trail.width = innerWidth * d; trail.height = innerHeight * d; tctx.setTransform(d, 0, 0, d, 0, 0); }
sizeTrail();
function burst(x, y, color, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(1.5, 5);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: rand(.02, .04), r: rand(1.2, 2.6), color });
  }
}
(function loop() {
  tctx.clearRect(0, 0, innerWidth, innerHeight);
  if (!reduce) for (const c of liveCursors) {
    const b = c.el.getBoundingClientRect();
    if (c.lx !== undefined && Math.hypot(b.left - c.lx, b.top - c.ly) > 1.5)
      parts.push({ x: b.left + 3, y: b.top + 3, vx: rand(-.3, .3), vy: rand(-.3, .3), life: 1, decay: .035, r: 2.2, color: c.color });
    c.lx = b.left; c.ly = b.top;
  }
  tctx.globalCompositeOperation = "lighter";
  parts = parts.filter(p => (p.life -= p.decay) > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vx *= .94; p.vy *= .94;
    tctx.fillStyle = p.color;
    tctx.globalAlpha = p.life * .25; tctx.beginPath(); tctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); tctx.fill();
    tctx.globalAlpha = p.life; tctx.beginPath(); tctx.arc(p.x, p.y, p.r * p.life + .3, 0, Math.PI * 2); tctx.fill();
  }
  tctx.globalAlpha = 1;
  requestAnimationFrame(loop);
})();

/* ---------- เคอร์เซอร์ ---------- */
function cursorSVG(color) {
  return `<svg width="22" height="24" viewBox="0 0 22 24"><path d="M2 1.5 L2 19.5 L7 15 L10.5 22.5 L13.6 21 L10.2 13.8 L17 13.5 Z" fill="${color}" stroke="#03110a" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
class Cursor {
  constructor({ name, color }) {
    this.name = name; this.color = color; this.busy = false;
    this.el = document.createElement("div");
    this.el.className = "cursor";
    this.el.style.setProperty("--cc", color);
    this.el.innerHTML = cursorSVG(color) + `<span class="tag">${name}</span>`;
    stage.appendChild(this.el);
    this.place(rand(0, innerWidth), innerHeight + 40, 0);
  }
  place(x, y, dur) {
    this.x = x; this.y = y;
    this.el.style.setProperty("--dur", dur + "ms");
    this.el.style.transform = `translate(${x}px, ${y}px)`;
  }
  async moveTo(x, y) {
    const d = Math.hypot(x - this.x, y - this.y);
    const dur = reduce ? 0 : Math.min(1300, 320 + d * 0.85);
    this.place(x, y, dur);
    await sleep(dur + 60);
  }
  async click() {
    this.el.classList.add("press");
    const r = document.createElement("div");
    r.className = "ripple";
    r.style.setProperty("--cc", this.color);
    r.style.left = this.x + 2 + "px"; r.style.top = this.y + 2 + "px";
    stage.appendChild(r);
    setTimeout(() => r.remove(), 750);
    burst(this.x + 2 - scrollX, this.y + 2 - scrollY, this.color);
    await sleep(140);
    this.el.classList.remove("press");
  }
  async wander(id) {
    while (id === runId) {
      if (!this.busy) {
        const nx = Math.min(innerWidth - 90, Math.max(10, this.x + rand(-110, 110)));
        await this.moveTo(nx, Math.max(20, this.y + rand(-70, 70)));
      }
      await sleep(rand(600, 1500));
    }
  }
}

function layout(i) {
  const W = innerWidth;
  if (W < 760) {
    const y = i === 0 ? 40 : 210 + (i - 1) * 195;
    const x = i === 0 ? 20 : (i % 2 ? 18 : Math.max(18, W - Math.min(290, W * .84) - 18));
    return { x, y };
  }
  const H = Math.max(innerHeight, 720);
  return { x: NOTES[i].x / 100 * W, y: NOTES[i].y / 100 * H };
}

function fitStage() {
  const notes = [...stage.querySelectorAll(".note")];
  const bottom = notes.reduce((m, n) => Math.max(m, n.offsetTop + n.offsetHeight), 0);
  stage.style.minHeight = Math.max(innerHeight, bottom + 120) + "px";
}

function makeNote(data, by, pos) {
  const n = document.createElement("div");
  n.className = "note" + (data.type === "title" ? " title" : "");
  if (data.color) n.style.setProperty("--c", data.color);
  n.style.setProperty("--r", data.type === "title" ? "0deg" : rand(-2, 2).toFixed(1) + "deg");
  n.style.left = pos.x + "px"; n.style.top = pos.y + "px";
  n.innerHTML = (data.title ? `<h3></h3>` : "") + `<div class="body"></div>` +
    (data.type === "title" ? "" : `<div class="by" style="color:${by.color}">— typed by ${by.name}</div>`);
  if (data.title) n.querySelector("h3").textContent = data.title;
  stage.appendChild(n);
  makeDraggable(n);
  return n;
}

async function typeInto(note, text, cursor, id) {
  const body = note.querySelector(".body");
  note.classList.add("typing");
  for (const ch of Array.from(text)) {
    if (id !== runId) return;
    body.textContent += ch;
    const r = document.createRange(); r.selectNodeContents(body);
    const rects = r.getClientRects(); const last = rects[rects.length - 1];
    if (last) cursor.place(last.right + scrollX + 8, last.bottom + scrollY - 6, 110);
    fitStage();
    await sleep(reduce ? 0 : (ch === "\n" ? 200 : rand(25, 65)));
  }
  note.classList.remove("typing");
  note.classList.add("done");
}

/* ---------- หน้าบูตแบบเทอร์มินัล ---------- */
async function boot(id) {
  const el = document.getElementById("boot"), pre = document.getElementById("bootText");
  el.classList.remove("hide"); pre.innerHTML = "";
  const lines = [
    ["> booting profile.exe", ""],
    ["> loading memories", " [OK]"],
    ["> connecting Mint, Bank, Ploy", " [OK]"],
    ["> rendering vibes", " [100%]"],
  ];
  for (const [l, ok] of lines) {
    for (const ch of l) { if (id !== runId) return; pre.innerHTML += ch; await sleep(reduce ? 0 : 18); }
    await sleep(reduce ? 0 : 140);
    pre.innerHTML += `<span class="ok">${ok}</span>\n`;
  }
  await sleep(reduce ? 0 : 350);
  el.classList.add("hide");
}

async function play() {
  const id = ++runId;
  stage.innerHTML = ""; parts = [];
  hint.classList.remove("show");
  await boot(id);
  if (id !== runId) return;
  const cursors = Object.fromEntries(CURSORS.map(c => [c.name, new Cursor(c)]));
  liveCursors = Object.values(cursors);
  liveCursors.forEach(c => c.wander(id));

  const queues = {};
  NOTES.forEach((n, i) => {
    const name = cursors[n.by] ? n.by : CURSORS[i % CURSORS.length].name;
    (queues[name] ||= []).push(i);
  });

  const jobs = Object.entries(queues).map(async ([name, idxs], k) => {
    const c = cursors[name];
    await sleep(k * 650 + 250);
    for (const i of idxs) {
      if (id !== runId) return;
      while (i > 0 && !stage.querySelector(`[data-i="${i - 1}"]`) && id === runId) await sleep(120);
      c.busy = true;
      const pos = layout(i);
      await c.moveTo(pos.x, pos.y);
      await c.click();
      const note = makeNote(NOTES[i], c, pos);
      note.dataset.i = i;
      await sleep(250);
      await typeInto(note, NOTES[i].text, c, id);
      c.busy = false;
      await sleep(400);
    }
  });

  await Promise.all(jobs);
  if (id === runId) hint.classList.add("show");
}

/* ---------- ผู้เยี่ยมชมคลิกเพื่อทิ้งข้อความ ---------- */
stage.addEventListener("click", e => {
  if (e.target.closest(".note")) return;
  const colors = ["#39ff88", "#b6ff3b", "#00e5b0", "#7dffb2"];
  const color = colors[(Math.random() * colors.length) | 0];
  burst(e.clientX, e.clientY, color, 24);
  const n = makeNote({ title: "ข้อความถึงภูมิ", color }, { name: "you", color }, { x: e.pageX - 20, y: e.pageY - 20 });
  n.classList.add("visitor");
  const body = n.querySelector(".body");
  body.contentEditable = "true";
  body.dataset.placeholder = "พิมพ์อะไรก็ได้...";
  body.focus();
  body.addEventListener("blur", () => { if (!body.textContent.trim()) n.remove(); fitStage(); });
  body.addEventListener("input", fitStage);
  fitStage();
});

/* ---------- ลากโน้ต ---------- */
function makeDraggable(n) {
  n.addEventListener("pointerdown", e => {
    if (e.target.isContentEditable) return;
    const sx = e.clientX - n.offsetLeft, sy = e.clientY - n.offsetTop;
    n.classList.add("dragging"); n.setPointerCapture(e.pointerId);
    const mv = ev => { n.style.left = ev.clientX - sx + "px"; n.style.top = ev.clientY - sy + "px"; };
    const up = () => { n.classList.remove("dragging"); n.removeEventListener("pointermove", mv); fitStage(); };
    n.addEventListener("pointermove", mv);
    n.addEventListener("pointerup", up, { once: true });
  });
}

document.getElementById("replay").addEventListener("click", e => { e.stopPropagation(); play(); });
play();
</script>
</body>
</html>
